name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all

      - name: Exercise Phase 0 restore gates on JS
        run: >-
          moon bench --release --target js
          -p dowdiness/living_chronicle/benchmarks/phase0
          -f egw_probe_benchmark.mbt --no-parallelize

      - name: Exercise Phase 0 restore gates on wasm-gc
        run: >-
          moon bench --release --target wasm-gc
          -p dowdiness/living_chronicle/benchmarks/phase0
          -f egw_probe_benchmark.mbt --no-parallelize

      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
